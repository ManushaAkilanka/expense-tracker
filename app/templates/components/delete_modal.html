<!-- Delete Confirmation Modal Component -->
<div id="delete-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-sm w-full p-6 animate-in fade-in zoom-in duration-150">
    <div class="w-12 h-12 rounded-2xl bg-rose-50 border border-rose-100 flex items-center justify-center text-rose-600 mb-4 mx-auto">
      <i data-lucide="alert-triangle" class="w-6 h-6"></i>
    </div>
    <div class="text-center">
      <h3 class="text-base font-bold text-slate-900 mb-1">Confirm Action</h3>
      <p id="delete-modal-title" class="text-xs text-slate-500 mb-6 leading-relaxed">
        Are you sure you want to proceed with this deletion? This action cannot be reversed.
      </p>
    </div>
    <form id="delete-modal-form" method="POST" class="flex items-center gap-3">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next_url" id="delete-next-url" value="/transactions">
      <button type="button" onclick="closeDeleteModal()" 
              class="flex-1 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
        Cancel
      </button>
      <button type="submit" 
              class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-sm transition">
        Delete
      </button>
    </form>
  </div>
</div>
