<!-- Top Bar Component -->
<header class="h-16 bg-white/90 backdrop-blur border-b border-slate-200/80 px-6 lg:px-8 flex items-center justify-between shrink-0 sticky top-0 z-30">
  <!-- Breadcrumbs & Status -->
  <div class="flex items-center gap-3 md:gap-4">
    <!-- Mobile Hamburger Toggle -->
    <button type="button" onclick="toggleMobileSidebar()" 
            class="md:hidden p-1.5 -ml-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition" 
            title="Toggle Navigation Menu">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <div class="hidden sm:flex items-center gap-2 text-xs font-medium text-slate-500">
      <span class="font-semibold text-slate-700">Project 2</span>
      <span>/</span>
      <span>Financial Engine</span>
      <span class="text-slate-300">•</span>
      <span class="text-slate-400">Python Core & Interactive Ledger</span>
    </div>

    <!-- Status badges -->
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-bold rounded-full">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        SYSTEM READY
      </span>
      <span class="hidden md:inline-flex items-center px-2.5 py-1 bg-slate-100 border border-slate-200 text-slate-600 text-[11px] font-semibold rounded-full">
        State: Preserved
      </span>
    </div>
  </div>

  <!-- User Profile & Sign Out -->
  <div class="flex items-center gap-3">
    {% if user %}
    <div class="flex items-center gap-2.5 pl-3 pr-2 py-1 bg-slate-50 border border-slate-200/80 rounded-full shadow-xs">
      <div class="flex flex-col text-right leading-tight">
        <span class="text-xs font-bold text-slate-800 max-w-[130px] truncate">{{ user.full_name }}</span>
        <span class="text-[10px] text-slate-400 font-medium">Developer</span>
      </div>
      {% if user.avatar_url %}
      <img src="{{ user.avatar_url }}" alt="{{ user.full_name }}" class="w-7 h-7 rounded-full object-cover border border-slate-200">
      {% else %}
      <div class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px] font-bold uppercase shadow-xs">
        {{ user.full_name[:2] }}
      </div>
      {% endif %}
      
      <!-- Sign out form -->
      <form action="/logout" method="POST" class="inline ml-1">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <button type="submit" title="Sign Out" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-slate-200/60 rounded-full transition">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
        </button>
      </form>
    </div>
    {% else %}
    <a href="/sign-in" class="px-4 py-1.5 text-xs font-bold text-blue-600 hover:bg-blue-50 rounded-xl transition">
      Sign In
    </a>
    {% endif %}
  </div>
</header>
