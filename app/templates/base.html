<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  
  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff3ff',
              100: '#dbe4fe',
              500: '#3b5bf6',
              600: '#2b4bee',
              700: '#1e3bbd',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="h-full font-sans text-slate-800 antialiased flex flex-col bg-slate-50">

  <div class="flex h-screen overflow-hidden">
    <!-- Left Sidebar -->
    {% include "components/sidebar.html" %}

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <!-- Topbar -->
      {% include "components/topbar.html" %}

      <!-- View Container -->
      <main class="flex-1 p-6 lg:p-8 max-w-7xl w-full mx-auto">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  {% include "components/delete_modal.html" %}

  <!-- Edit Expense Modal -->
  <div id="edit-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-md w-full p-6 animate-in fade-in zoom-in duration-150">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-blue-600"></i> Edit Expense Entry
        </h3>
        <button type="button" onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="edit-modal-form" method="POST" class="mt-4 space-y-4">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next_url" id="edit-next-url" value="/transactions">
        {% if error %}
        <div id="edit-modal-error-alert" class="flex items-start gap-2 p-2.5 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700">
          <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-500 shrink-0 mt-0.5"></i>
          <span class="flex-1 font-medium">{{ error }}</span>
        </div>
        {% endif %}
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Expense Amount (Rs.)</label>
          <div class="relative">
            <span class="absolute left-3.5 top-2.5 text-slate-400 font-mono font-semibold text-xs">Rs.</span>
            <input type="number" step="0.01" min="0.01" id="edit-amount-input" name="amount" required
                   class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-slate-900 font-mono font-bold focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Description / Note</label>
          <input type="text" id="edit-desc-input" name="description" required maxlength="500"
                 class="w-full px-4 py-2 border border-slate-200 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Category</label>
          <input type="text" id="edit-category-input" name="category"
                 class="w-full px-4 py-2 border border-slate-200 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
        </div>
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
            Cancel
          </button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-sm transition">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/static/js/app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
